[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qtf"
version = "0.4.0"
description = "Quantum Torsion Folding: a hybrid quantum-classical protein structure prediction package"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Fabio Cumbo", email = "cumbof@ccf.org" },
    { name = "Bryan Raubenolt", email = "raubenb@ccf.org" },
    { name = "Varun Puram", email = "puramv@ccf.org" },
    { name = "Jayadev Joshi", email = "joshij@ccf.org" },
    { name = "Daniel Blankenberg", email = "blanked2@ccf.org" },
]
requires-python = ">=3.9"
keywords = ["quantum computing", "protein folding", "biophysics", "VQE", "qiskit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
    "plotly>=5.18",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]
notebook = [
    "jupyter",
    "nbformat",
]
workflows = [
    "matplotlib>=3.7",
    "mdtraj>=1.9",
    "biopython>=1.80",
    "openmm>=8.0",
]
gpu = [
    "numba>=0.58",
    "qiskit-aer-gpu>=0.14",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/cumbof/QTF"
Repository = "https://github.com/cumbof/QTF"
Issues = "https://github.com/cumbof/QTF/issues"

[project.scripts]
qtf-run = "qtf.cli.run:main"
qtf-fold = "qtf.cli.fold:main"
qtf-bench = "qtf.cli.bench:main"
qtf-eval = "qtf.cli.eval:main"
qtf-grid-search = "qtf.cli.grid_search:main"
qtf-relax = "qtf.cli.relax:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qtf*"]

[tool.ruff]
line-length = 120
target-version = "py39"
